spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/test
    username: test
    password: test
    hikari:
      # O JUnit mantém vários contextos vivos no mesmo JVM, cada um com seu pool; o tamanho de
      # produção somado entre eles passa do max_connections do Postgres.
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
  mail:
    host: localhost
    port: 1025

puccomp:
  notification:
    # Ligadas, entrariam no meio de um teste que conta mensagens. "-" desativa o agendamento.
    digest-cron: "-"
    reminder-cron: "-"
  security:
    jwt:
      secret: test-secret-pelo-menos-32-bytes-para-hs256-0123456789
    password-reset:
      url-base: http://localhost/redefinir-senha
  onboarding:
    accept-url-base: http://localhost/aceitar-convite
  admin:
    key: test-admin-key
  cors:
    allowed-origins: https://puccomp.com.br,http://localhost:5173

management:
  health:
    # O contributor de mail exige um JavaMailSenderImpl concreto; os testes que precisam observar
    # o envio trocam o transporte por mock, e sem isso o contexto nem sobe.
    mail:
      enabled: false
