spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/puccomp
    username: puccomp
    password: puccomp
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  # Mailpit (compose.yml): entrega local sem credencial nenhuma, caixa em http://localhost:8025.
  # Precisa sobrescrever os quatro: no application.yaml eles são ${MAIL_*} sem default, de
  # propósito — em produção faltar SMTP tem que derrubar o boot, não passar despercebido.
  mail:
    host: localhost
    port: 1025
    username: ""
    password: ""
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
            required: false

puccomp:
  security:
    jwt:
      secret: dev-secret-change-me-please-pelo-menos-32-bytes-0123456789
  onboarding:
    accept-url-base: http://localhost:8080/aceitar-convite
  admin:
    key: dev-admin-key

management:
  tracing:
    sampling:
      probability: 1.0
