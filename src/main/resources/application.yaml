spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
      file-size-threshold: 0
  application:
    name: puccomp-api
  threads:
    virtual:
      # Requisição bloqueada em I/O desmonta da carrier thread em vez de ocupá-la. Vale para o
      # servidor MCP, onde o agente dispara várias chamadas em paralelo, e o pinning de
      # `synchronized` que travava JDBC saiu no JEP 491 (JDK 24) — estamos em 25.
      enabled: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # Com virtual threads o teto de concorrência deixa de ser o pool do Tomcat e passa a ser este
      # número: a requisição só progride quando consegue uma conexão. O padrão de 10 é pouco para o
      # tráfego da UI somado ao de agente, que chama a API em rajada de tool calls.
      maximum-pool-size: ${DB_POOL_SIZE:20}
  jackson:
    property-naming-strategy: SNAKE_CASE
  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    open-in-view: false
  flyway:
    enabled: true
  modulith:
    events:
      jdbc:
        # O dono do esquema é o Flyway (V20).
        schema-initialization:
          enabled: false
      # Aviso que não completou volta para a fila no boot.
      republish-outstanding-events-on-restart: true
  profiles:
    active: dev
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
  task:
    execution:
      # O pool de e-mail publica um Executor, o que sozinho faria o applicationTaskExecutor do Boot
      # sumir do contexto. "force" mantém os dois.
      mode: force
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        serialization-mode: via-dto

puccomp:
  files:
    enabled: ${FILES_ENABLED:false}
    bucket: ${FILES_BUCKET:}
    region: ${AWS_REGION:sa-east-1}
    endpoint: ${FILES_ENDPOINT:}
    path-style: ${FILES_PATH_STYLE:false}
    download-ttl-seconds: 300
    clamav-host: ${CLAMAV_HOST:localhost}
    clamav-port: ${CLAMAV_PORT:3310}
    max-pages: ${FILES_MAX_PAGES:20}
    # Uma página A4 escaneada a 300 dpi RGB já descomprime ~26 MiB: o orçamento acompanha as
    # páginas reais, e max-decompressed é o teto que segura zip bomb em documento longo.
    decompressed-per-page: ${FILES_DECOMPRESSED_PER_PAGE:32MB}
    max-decompressed: ${FILES_MAX_DECOMPRESSED:256MB}
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token-ttl: 8h
    password-reset:
      # Página do front que recebe o ?token= do e-mail; a API não serve essa tela.
      url-base: ${PASSWORD_RESET_URL}
      ttl: 1h
  onboarding:
    accept-url-base: ${ONBOARDING_ACCEPT_URL}
    invitation-ttl: 72h
  notification:
    # immediate: um aviso por inscrição para quem tem recruitment:read.
    # digest: um resumo diário às 8h, para EJ com volume de inscrições.
    new-application: ${NOTIFY_NEW_APPLICATION:immediate}
    # Antecedência com que o convite pendente é lembrado a quem o enviou.
    invitation-reminder: ${NOTIFY_INVITATION_REMINDER:24h}
  email:
    # Remetente de todo email transacional; em produção precisa estar verificado no SES.
    # Aceita ONBOARDING_FROM para não quebrar quem já tem esse nome no .env de produção.
    from: ${MAIL_FROM:${ONBOARDING_FROM:nao-responda@puccomp.com.br}}
  admin:
    key: ${PUCCOMP_ADMIN_KEY:}
  cors:
    # Origens do front que podem chamar a API pelo navegador. Vira lista separada por vírgula.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

server:
  tomcat:
    # Sem isso o Tomcat aborta o upload grande e fecha a conexão antes de terminar de ler o corpo,
    # e quem enviou recebe reset em vez do 413 — o limite multipart é 5MB, o padrão daqui é 2MB.
    max-swallow-size: -1
  error:
    include-stacktrace: never
    include-exception: false
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  otlp:
    metrics:
      export:
        enabled: false

springdoc:
  swagger-ui:
    path: /docs
  # Sem isso o springdoc publica as respostas sob o media type `*/*`, que geradores de cliente
  # não sabem interpretar.
  default-produces-media-type: application/json
