spring:
  application:
    name: puccomp-api
  cloud:
    aws:
      region:
        static: ${AWS_REGION:us-east-1}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jackson:
    property-naming-strategy: SNAKE_CASE
  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    open-in-view: false
  flyway:
    enabled: true
  profiles:
    active: dev
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        serialization-mode: via-dto

puccomp:
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token-ttl: 8h
  onboarding:
    accept-url-base: ${ONBOARDING_ACCEPT_URL}
    from-address: ${ONBOARDING_FROM:nao-responda@puccomp.com.br}
    invitation-ttl: 72h
  admin:
    key: ${PUCCOMP_ADMIN_KEY:}
  cors:
    # Origens do front que podem chamar a API pelo navegador. Vira lista separada por vírgula.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

server:
  error:
    include-stacktrace: never
    include-exception: false
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  otlp:
    metrics:
      export:
        enabled: false

springdoc:
  swagger-ui:
    path: /docs
  # Sem isso o springdoc publica as respostas sob o media type `*/*`, que geradores de cliente
  # não sabem interpretar.
  default-produces-media-type: application/json
