services:
  nginx:
    image: nginx:alpine
    ports:      
      - "80:80"   # Redireciona para HTTPS
      - "443:443" # Exige certificado montado no nginx.conf
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - grafana

  api:
    image: ghcr.io/puccomp/puccomp-api-v2:latest # Ajuste para o repo da COMP
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/puccomp      
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASS}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}      
      - SPRING_PROFILES_ACTIVE=prod
      # O SES funciona automático se a Role da EC2 tiver a permissão SES:SendEmail
      # Sem JWT_SECRET a aplicação não sobe: o placeholder não tem default.
      - JWT_SECRET=${JWT_SECRET}
      # Sem PUCCOMP_ADMIN_KEY o filtro de chave de plataforma fica desligado (o default
      # é vazio) e POST /v1/admin/tenants responde 401 para qualquer chave.
      - PUCCOMP_ADMIN_KEY=${PUCCOMP_ADMIN_KEY}
      # Base do link que vai no e-mail de convite: se apontar para localhost, o convidado
      # recebe um link que não abre.
      - ONBOARDING_ACCEPT_URL=${ONBOARDING_ACCEPT_URL}
      - ONBOARDING_FROM=${ONBOARDING_FROM}
      # Origens do front liberadas no CORS. Sem isto, o navegador bloqueia as chamadas.
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: puccomp
    volumes:
      - pgdata:/var/lib/postgresql/data # Garante que os dados não somem
    # O Flyway vai rodar automaticamente quando a API do Spring Boot iniciar

  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    # Sem 'ports', fica 100% interno

  grafana:
    image: grafana/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASS}
      - GF_SERVER_ROOT_URL=https://puccomp.com.br/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana_data:/var/lib/grafana
    # Nginx vai rotear o tráfego para ele internamente na porta 3000

  node_exporter:
    image: prom/node-exporter:latest
    # Sem ports

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0 # Versão compatível com ARM64
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    # Sem ports

volumes:
  pgdata:
  grafana_data: